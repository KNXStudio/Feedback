name: Suggest an Improvement
description: Suggest a new feature or an improvement to KNX Studio.
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KNX Studio!

  - type: textarea
    id: improvement
    attributes:
      label: What would you like to improve?
      description: Describe the feature or improvement you would like to see.
      placeholder: Tell us what you would like KNX Studio to do differently...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
      description: Tell us about the problem this would solve or how it would improve your workflow.
      placeholder: Describe when or why you would use this...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: If you already have an idea, describe how you imagine it working.
      placeholder: This could work by...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, examples, links, or anything else that might help.
    validations:
      required: false
